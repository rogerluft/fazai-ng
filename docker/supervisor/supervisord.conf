; =============================================================================
  ; FazAI-NG - Supervisord Configuration
; =============================================================================
  ; Gerencia os processos Next.js e ttyd no container
; =============================================================================

  [supervisord]
  nodaemon=true
  user=root
  logfile=/var/log/supervisor/supervisord.log
  pidfile=/var/run/supervisord.pid
  childlogdir=/var/log/supervisor

  ; =============================================================================
  ; Next.js - Dashboard Web (porta principal 10000)
; =============================================================================
  [program:nextjs]
  command=npm run start -- -p %(ENV_PORT)s
  directory=/app/web
  autostart=true
  autorestart=true
  stderr_logfile=/var/log/supervisor/nextjs.err.log
  stdout_logfile=/var/log/supervisor/nextjs.out.log
  environment=NODE_ENV="production",PORT="%(ENV_PORT)s"
  priority=10

  ; =============================================================================
  ; ttyd - Terminal Web (porta interna 7681, proxy pelo Next.js)
; =============================================================================
[program:ttyd]
  command=ttyd -p %(ENV_TTYD_PORT)s -c %(ENV_TTYD_USERNAME)s:%(ENV_TTYD_PASSWORD)s -W bash
autostart=true
autorestart=true
  stderr_logfile=/var/log/supervisor/ttyd.err.log
  stdout_logfile=/var/log/supervisor/ttyd.out.log
  priority=20

  ; =============================================================================
  ; Grupo de processos
; =============================================================================
  [group:fazai]
  programs=nextjs,ttyd
  priority=999
